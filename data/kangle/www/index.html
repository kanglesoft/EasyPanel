<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务器已就绪</title>
<style>
  :root{
    --c-primary: oklch(43.91% 0.322 284.15deg);
    --c-primary-soft: oklch(43.91% 0.322 284.15deg / 0.10);
    --c-bg: oklch(98.5% 0.003 284);
    --c-card: #ffffff;
    --c-text: oklch(25% 0.02 284);
    --c-muted: oklch(55% 0.02 284);
    --c-border: oklch(92% 0.01 284);
    --shadow: 0 10px 30px -12px oklch(43.91% 0.322 284.15deg / 0.25);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --c-bg: oklch(20% 0.01 284);
      --c-card: oklch(25% 0.012 284);
      --c-text: oklch(92% 0.01 284);
      --c-muted: oklch(68% 0.015 284);
      --c-border: oklch(35% 0.015 284);
      --shadow: 0 10px 30px -10px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%, var(--c-primary-soft), var(--c-bg) 60%);
    color:var(--c-text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:24px;
  }
  .card{
    background:var(--c-card);border:1px solid var(--c-border);border-radius:18px;
    box-shadow:var(--shadow);padding:48px 44px;max-width:560px;text-align:center;
  }
  .badge{display:inline-block;padding:5px 14px;border-radius:999px;background:var(--c-primary-soft);
    color:var(--c-primary);font-size:13px;font-weight:600}
  h1{font-size:26px;margin-top:16px;letter-spacing:.5px}
  .desc{color:var(--c-muted);margin-top:12px;line-height:1.8;font-size:14px}
  .links{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{padding:11px 22px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;transition:.12s}
  .btn.primary{background:var(--c-primary);color:#fff}
  .btn.ghost{border:1px solid var(--c-border);color:var(--c-text)}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Easypanel · Kangle</span>
    <h1>服务器已就绪</h1>
    <div class="desc">
      欢迎使用本服务器。默认站点根目录为 <code>www/</code>。<br>
      如需管理面板，请访问对应的后台地址。
    </div>
    <div class="links">
      <a class="btn primary" href="/">站点首页</a>
      <a class="btn ghost" id="ep" href="#">easypanel 后台</a>
      <a class="btn ghost" id="ka" href="#">kangle 管理</a>
    </div>
  </div>
  <script>
    var h = location.hostname;
    document.getElementById('ep').href = 'http://' + h + ':3312/';
    document.getElementById('ka').href = 'http://' + h + ':3311/';
  </script>
</body>
</html>
