<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>403 - 禁止访问</title>
<style>
  :root{
    --c-primary: oklch(43.91% 0.322 284.15deg);
    --c-primary-soft: oklch(43.91% 0.322 284.15deg / 0.10);
    --c-bg: oklch(98.5% 0.003 284);
    --c-card: #ffffff;
    --c-text: oklch(25% 0.02 284);
    --c-muted: oklch(55% 0.02 284);
    --c-border: oklch(92% 0.01 284);
    --shadow: 0 10px 30px -12px oklch(43.91% 0.322 284.15deg / 0.25);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --c-bg: oklch(20% 0.01 284);
      --c-card: oklch(25% 0.012 284);
      --c-text: oklch(92% 0.01 284);
      --c-muted: oklch(68% 0.015 284);
      --c-border: oklch(35% 0.015 284);
      --shadow: 0 10px 30px -10px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%, var(--c-primary-soft), var(--c-bg) 60%);
    color:var(--c-text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:24px;
  }
  .card{
    background:var(--c-card);border:1px solid var(--c-border);border-radius:18px;
    box-shadow:var(--shadow);padding:48px 44px;max-width:520px;text-align:center;
  }
  .code{font-size:88px;font-weight:800;line-height:1;letter-spacing:2px;
    background:linear-gradient(135deg,var(--c-primary),oklch(58% 0.18 300deg));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .title{font-size:20px;font-weight:700;margin-top:8px}
  .desc{color:var(--c-muted);margin-top:10px;line-height:1.7;font-size:14px}
  .btn{
    display:inline-block;margin-top:26px;padding:11px 26px;border-radius:10px;
    background:var(--c-primary);color:#fff;text-decoration:none;font-weight:600;font-size:14px;
    transition:transform .12s ease,filter .12s ease;
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
  .ico{margin:6px auto 14px;width:76px;height:76px}
</style>
</head>
<body>
  <div class="card">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3l8 4v5c0 4.5-3.2 7.6-8 9-4.8-1.4-8-4.5-8-9V7l8-4z"></path>
      <line x1="9" y1="12" x2="15" y2="12"></line>
    </svg>
    <div class="code">403</div>
    <div class="title">访问被拒绝</div>
    <div class="desc">您没有权限访问此资源。<br>如需帮助，请联系服务器管理员。</div>
    <a class="btn" href="/">返回首页</a>
  </div>
</body>
</html>
