{{include file='common/head.html'}}

<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header">
      <h3>计划任务设置</h3>
      <a href='?c=cron&a=sync' class="btn btn-sm btn-secondary"><i data-lucide="refresh-cw"></i> 重建计划任务</a>
    </div>
    <div class="ep-card-body">
      <div class="ep-table-responsive"><table class="table ep-mb-4">
        <thead>
          <tr>
            <th>操作</th>
            <th>时间</th>
            <th>命令</th>
          </tr>
        </thead>
        <tbody>
          {{foreach from=$crons item=cron}}
          <tr>
            <td>[<a href='?c=cron&a=del&id={{$cron.id}}'>删除</a>]</td>
            <td>{{$cron.min}} {{$cron.hour}} {{$cron.day}} {{$cron.month}} {{$cron.mday}}</td>
            <td>{{$cron.cmd}}</td>
          </tr>
          {{/foreach}}
        </tbody>
      </table></div>

      <form action='?c=cron&a=add' method='post' class="ep-form">
        <div class="form-group">
          <label>时间(crontab格式)</label>
    <div class="controls"><input name='t' class="span4"></div>
  </div>
        <div class="form-group">
          <label>网址</label>
    <div class="controls"><input name='cmd' class="span5"></div>
  </div>
        <div class="form-group">
          <label></label>
    <div class="controls"><input type='submit' value='增加' class="btn" /></div>
  </div>
      </form>
    </div>
  </div>
</div>
{{include file='common/foot.html'}}
