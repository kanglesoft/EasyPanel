{{include file='common/head.html'}}

<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header"><h3>程序安装</h3></div>
    <div class="ep-card-body">
      <form id="form1" name="form1" method="post" action="?c=webapp&a=install&step=1&appid={{$appid}}&appname={{$appname}}&appver={{$appver}}" class="ep-form">
        <div class="form-group">
          <label>安装域名</label>
    <div class="controls"><select name='domain'>
            {{foreach from=$domain item=row}}
            <option value='{{$row}}'>{{$row}}</option>
            {{/foreach}}
          </select></div>
  </div>
        <div class="form-group">
          <label>安装目录</label>
    <div class="controls"><input name="dir" type="text" value="{{$dir}}" /></div>
  </div>
        <div class="form-group">
          <label></label>
    <div class="controls"><input type="submit" value="下一步" class="btn"></div>
  </div>
      </form>
    </div>
  </div>
</div>
{{include file='common/foot.html'}}
