{{include file='common/head.html'}}
<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header"><h3>禁止IP访问</h3></div>
    <div class="ep-card-body">
      <div class="ep-flex ep-flex-wrap ep-gap-2 ep-mb-4">
        {{if $at==0}}
        <a href="?c=banip&a=switchIp&status=1" class="btn"><i data-lucide="power"></i> 开启IP禁止功能</a>
        {{else}}
        <a href="?c=banip&a=switchIp&status=2" class="btn btn-danger"><i data-lucide="power-off"></i> 关闭IP禁止功能</a>
        {{/if}}
      </div>

      <div class="ep-table-responsive"><table class="table ep-mb-4">
        <thead>
          <tr>
            <th>操作</th>
            <th>IP</th>
            <th>过期时间</th>
          </tr>
        </thead>
        <tbody>
          {{foreach from=$ips item=row}}
          <tr>
            <td><a href="?c=banip&a=delBanip&id={{$row.id}}">删除</a></td>
            <td>{{$row.ip}}</td>
            <td>{{if $row.expire==0}}永久{{else}}{{ceil(($row.expire-time())/60)}}分钟{{/if}}</td>
          </tr>
          {{/foreach}}
        </tbody>
      </table></div>

      <form action='?c=banip&a=addBanip' method='post' class="ep-form">
        <div class="form-group">
          <label>IP地址（如:192.168.0.1,192.168.0.1/24）</label>
    <div class="controls"><input name='ip' id='ip' value='' /></div>
  </div>
        <div class="form-group">
          <label>禁止时间（0表示永久，单位：分钟）</label>
    <div class="controls"><input name='life_time' value='0' size=5></div>
  </div>
        <div class="form-group">
          <label></label>
    <div class="controls"><input type='submit' value='禁止访问' class="btn"></div>
  </div>
      </form>
    </div>
  </div>
</div>
{{include file='common/foot.html'}}
