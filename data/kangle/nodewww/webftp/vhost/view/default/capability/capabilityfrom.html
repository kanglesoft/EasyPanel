{{include file='common/head.html'}}
<script src="/style/js/highcharts.js" type="text/javascript"></script>
<script src="/style/js/themes/grid.js" type="text/javascript"></script>
<script src="/style/js/modules/exporting.js" type="text/javascript"></script>

<script type="text/javascript">
function rate_format(size){
  var units = ' B/s';
  if(size/1024>1){
    size = size/1024;
    units = ' KB/s';
  }
  if(size/1024>1){
    size = size/1024;
    units = ' MB/s';
  }
  if(size/1024>1){
    size = size/1024;
    units = ' GB/s';
  }
  return size.toFixed(2)+units;
}
$(function() {
  Highcharts.setOptions({
    global: { useUTC: false }
  });
  chart = new Highcharts.Chart({
    chart: { renderTo: 'connection', defaultSeriesType: 'line' },
    title: { text: '当前网站连接数分析图' },
    xAxis: {
      title: { text: '时间' },
      type: 'datetime',
      tickPixelInterval: 150
    },
    yAxis: {
      title: { text: '连接数' },
      plotLines: [{ value: 0, width: 1, color: '#808080' }]
    },
    tooltip: {
      formatter: function() {
        return '<b>' + this.series.name + '</b><br/>' +
                Highcharts.dateFormat('%Y-%m-%d %H:%M:%S', this.x) + '<br/>' +
                this.y;
      }
    },
    legend: { enabled: true },
    exporting: { enabled: true },
    series: [{
      name: '连接数',
      data: (function() {
        var data = [], time = (new Date()).getTime(), i;
        for (i = -100; i <= 0; i++) {
          data.push({ x: time + i * 1000, y: 0 });
        }
        return data;
      })()
    }]
  });
  getInfo();
});

$(function() {
  Highcharts.setOptions({ global: { useUTC: false } });
  chart2 = new Highcharts.Chart({
    chart: { renderTo: 'bandwith', defaultSeriesType: 'line' },
    title: { text: '当前网站速度分析图' },
    xAxis: {
      title: { text: '时间' },
      type: 'datetime',
      tickPixelInterval: 150
    },
    yAxis: {
      title: { text: '速度' },
      plotLines: [{ value: 0, width: 1, color: '#808080' }]
    },
    tooltip: {
      formatter: function() {
        return '<b>' + this.series.name + '</b><br/>' +
                Highcharts.dateFormat('%Y-%m-%d %H:%M:%S', this.x) + '<br/>' +
                rate_format(this.y);
      }
    },
    legend: { enabled: true },
    exporting: { enabled: true },
    series: [{
      name: '速率',
      data: (function() {
        var data = [], time = (new Date()).getTime(), i;
        for (i = -100; i <= 0; i++) {
          data.push({ x: time + i * 1000, y: 0 });
        }
        return data;
      })()
    }]
  });
  getInfo();
});

function getInfo() {
  $.post("?c=capability&a=capabilityGet", {"random":Math.random()}, function(data) {
    var result = {"x":data.speed,"y":data.connect};
    var time = (new Date()).getTime();
    var series = chart.series[0];
    var series2 = chart2.series[0];
    series.addPoint([time, result.y], true, true);
    series2.addPoint([time, result.x], true, true);
  }, "json");
}
setInterval(getInfo, 5000);
</script>

<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header"><h3>性能分析</h3></div>
    <div class="ep-card-body">
      <div id="connection" class="ep-chart-sm"></div>
      <div id="bandwith" class="ep-chart-sm"></div>
      <div id='msg'></div>
    </div>
  </div>
</div>
