{{include file='common/head.html'}}
<script src="/style/js/highcharts.js" type="text/javascript"></script>
<script src="/style/js/themes/grid.js" type="text/javascript"></script>
<script src="/style/js/modules/exporting.js" type="text/javascript"></script>

<script type="text/javascript">
function size_format(size){
  var units = ' Bytes';
  if(size/1024>10){
    size = size/1024;
    units = ' KB';
  }
  if(size/1024>10){
    size = size/1024;
    units = ' MB';
  }
  if(size/1024>10){
    size = size/1024;
    units = ' GB';
  }
  return size.toFixed(2)+units;
}
var chart;
$(document).ready(function () {
  chart = new Highcharts.Chart({
    chart: { renderTo: 'flow', defaultSeriesType: 'line', inverted: false },
    xAxis: { categories: [{{$cate}}] },
    yAxis: { title: {text: '流量 (Bytes)'}, min:0 },
    tooltip: {
      formatter: function() {
        return '流量:' + size_format(this.y)+'<br/>当前时间:'+ this.x ;
      }
    },
    credits: { enabled: false },
    plotOptions: {
      column: { pointPadding: 0.2, borderWidth: 0 },
      bar: { dataLabels: { enabled: true } }
    },
    title: { text: '当{{$datename}}流量示意图(单位:Bytes)' },
    series:[{ {{$flow}} },{ {{$flow_cache}} }]
  });
});
</script>

<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header">
      <h3>流量查看</h3>
      <div>
        <a href="?c=flow&a=viewFlow&t=day" class="btn btn-sm btn-secondary"><i data-lucide="clock"></i> 最近24小时</a>
        <a href="?c=flow&a=viewFlow&t=month" class="btn btn-sm btn-secondary"><i data-lucide="calendar"></i> 最近31天</a>
      </div>
    </div>
    <div class="ep-card-body">
      <div id="flow" class="ep-chart"></div>
    </div>
  </div>
</div>
