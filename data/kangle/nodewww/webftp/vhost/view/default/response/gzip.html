{{include file='common/head.html'}}
<script type="text/javascript">
  function submit() {
    var gzip = $("#gzip").val();
    $.get("?c=response&a=addGzip&gzip=" + gzip, function(data) {
      alert(data);
    });
  }
  function del() {
    var r = confirm("确认删除该项设置？");
    if (r == false) return;
    $.get("?c=response&a=delGzip", function(data) {
      alert(data);
    });
  }
</script>

<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header"><h3>开启页面Gzip压缩</h3></div>
    <div class="ep-card-body">
      <div class="ep-alert ep-alert-info ep-mb-4">
        注：此功能将服务器数据压缩后发送给浏览者，这将有助于提高您的网页打开速度！
      </div>
      <form action='javascript:submit();' method='post' class="ep-form">
        <div class="form-group">
          <label>匹配Content-Type</label>
    <div class="controls">
            <input name='gzip' id='gzip' value='(text/css)|(text/ht*)|(javascript)' />
            <span class="help-text">支持正则表达式，如果不熟悉设置，默认即可！</span></div>
  </div>
        <div class="form-group">
          <label></label>
    <div class="controls"><input type='submit' value='开启' class="btn" />
          <input type="button" onclick="javascript:del();" value="清除设置" class="btn btn-danger" /></div>
  </div>
      </form>
    </div>
  </div>
</div>
{{include file='common/foot.html'}}
