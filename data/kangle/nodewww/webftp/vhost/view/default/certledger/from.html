{{include file='common/head.html'}}

<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header">
      <h3><i data-lucide="badge-check"></i> 手动证书入台账</h3>
      <a href='?c=certledger&a=list' class="btn btn-sm btn-secondary"><i data-lucide="arrow-left"></i> 返回台账</a>
    </div>
    <div class="ep-card-body">
      <div class="ep-alert ep-alert-info ep-mb-4">
        粘贴 PEM 格式的证书内容（以 <b>-----BEGIN CERTIFICATE-----</b> 开头，可含完整证书链，解析取首张叶子证书）。
        本页面只把证书信息记入台账，<b>不会</b>替换站点当前生效的证书；替换生效证书请前往「SSL 证书」页。
      </div>

      <form action='?c=certledger&a=add' method='post' class="ep-form">
        <div class="form-group">
          <label>证书 PEM 内容 <span class="ep-text-danger">*</span></label>
          <div class="controls"><textarea name='certificate' id='certificate' cols=90 rows=10 class="span7" placeholder="-----BEGIN CERTIFICATE-----&#10;...&#10;-----END CERTIFICATE-----"></textarea></div>
        </div>
        <div class="form-group">
          <label>关联域名</label>
          <div class="controls">
            <input type='text' name='domain' id='domain' placeholder='留空则取证书 SAN 首个域名；填写后校验 SAN 是否覆盖该域名'>
            <span class="help-text">支持通配符证书，如 *.example.com；域名与 SAN 不匹配时会被拒绝入台账</span>
          </div>
        </div>
        <div class="form-group">
          <label>备注</label>
          <div class="controls">
            <input type='text' name='note' id='note' maxlength="200" placeholder='例如：阿里云免费证书 / 客户自购 OV 证书（最多 200 字符）'>
          </div>
        </div>
        <div class="form-group">
          <label></label>
          <div class="controls"><input type='submit' value='解析并入台账' class="btn" /></div>
        </div>
      </form>
    </div>
  </div>
</div>

{{include file='common/foot.html'}}
