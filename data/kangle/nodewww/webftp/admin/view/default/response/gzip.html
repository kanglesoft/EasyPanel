{{include file='common/head.html'}}
<script type="text/javascript">
function submit()
{
	var gzip = $("#gzip").val();
	$.get( "?c=response&a=addGzip&gzip="+gzip,function(data){ alert(data); });
}
function del()
{
	var r=confirm("确认删除该项设置?");
	if(r==false)return;
	$.get("?c=response&a=delGzip", function(data){ alert(data); });
}
</script>
<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header"><h3>开启gzip压缩</h3></div>
    <div class="ep-card-body">
      <form action='javascript:submit();' method='post' class="ep-form">
        <div class="form-group">
          <label>匹配Content-Type:</label>
          <div class="controls">
            <input name='gzip' id='gzip' value='(text/css)|(text/ht*)|(javascript)'>
            <span class="help-text">注：支持正则表达式，如果不熟悉设置，默认即可</span>
            <button type='submit' class="btn btn-sm">开启</button>
            <button type="button" class="btn btn-sm btn-danger" onclick="javascript:del();">清除设置</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{{include file='common/foot.html'}}
