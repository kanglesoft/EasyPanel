{{include file='common/head.html'}}
<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header">
      <h3>文件管理</h3>
      <span class="ep-muted" style="font-size:12px;">根目录固定为容器内 /home/ftp（站点家目录），仅管理员可见；所有写操作均记录审计日志。</span>
    </div>
    <div class="ep-card-body">
      <div id="msg" class="ep-alert ep-alert-danger" style="display:none;"></div>
      <div id="okmsg" class="ep-alert ep-alert-success" style="display:none;"></div>

      <!-- 路径面包屑 -->
      <div class="fm-path ep-flex ep-gap-1 ep-mb-3" style="align-items:center;flex-wrap:wrap;">
        <a href="javascript:;" data-dir="/" class="fm-root" style="font-weight:600;color:var(--color-primary,#2563eb);">/home/ftp</a>
        <span id="pathtrail"></span>
      </div>

      <!-- 工具栏 -->
      <div class="ep-flex ep-gap-2 ep-mb-3" style="align-items:center;flex-wrap:wrap;">
        <button id="refreshBtn" class="btn btn-sm">刷新</button>
        <button id="uploadBtn" class="btn btn-sm btn-primary">上传</button>
        <button id="mkdirBtn" class="btn btn-sm">新建文件夹</button>
        <button id="batchZipBtn" class="btn btn-sm">打包下载</button>
        <button id="batchDelBtn" class="btn btn-sm btn-danger">批量删除</button>
        <span id="selInfo" class="ep-muted" style="font-size:12px;"></span>
        <span id="prog" class="ep-muted" style="font-size:12px;color:var(--color-primary,#2563eb);"></span>
        <input type="file" id="fileInput" multiple style="display:none;">
      </div>

      <div class="ep-table-responsive">
        <table class="table" id="ftable">
          <thead>
            <tr>
              <th style="width:32px;"><input type="checkbox" id="checkAll"></th>
              <th>名称</th>
              <th style="width:110px;">大小</th>
              <th style="width:160px;">修改时间</th>
              <th style="width:80px;">权限</th>
              <th style="width:320px;">操作</th>
            </tr>
          </thead>
          <tbody id="fbody">
            <tr><td colspan="6" class="ep-muted" style="text-align:center;padding:24px;">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 文本编辑弹层 -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100000;align-items:center;justify-content:center;">
  <div style="width:760px;max-width:94vw;max-height:86vh;background:#fff;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;">
    <div style="padding:14px 18px;font-weight:600;color:#0f172a;border-bottom:1px solid #e2e8f0;" id="editTitle">编辑文件</div>
    <textarea id="editArea" style="flex:1;min-height:320px;border:none;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;resize:none;outline:none;"></textarea>
    <div style="padding:10px 18px 16px;display:flex;justify-content:flex-end;gap:10px;">
      <button id="editCancel" class="btn btn-sm">取消</button>
      <button id="editSave" class="btn btn-sm btn-primary">保存</button>
    </div>
  </div>
</div>

<script src="{{$STATIC}}filemanager/utils.js"></script>
{{include file='common/foot.html'}}
