{{include file='common/head.html'}}
<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header"><h3>添加域名</h3></div>
    <div class="ep-card-body">
      <form action='?c=dnsdomain&a=dnsdomainAdd' method='post' class="ep-form">
        <div class="form-group">
          <label>域名:</label>
    <div class="controls">
    <input name='name' type='text' >
  </div>
  </div>
        <div class="form-group">
          <label>最多条数:</label>
    <div class="controls">
    <input name='max_record' type='text' >
  </div>
  </div>
        <div class="form-group">
          <label>解析服务器:</label>
    <div class="controls">
    <input name='server' type='text' >
  </div>
  </div>
        <div class="ep-flex ep-gap-2 ep-mt-4">
          <button type="submit" class="btn" style="width:200px;"><i data-lucide="check"></i> 确认提交</button>
        </div>
      </form>
    </div>
  </div>
</div>
{{include file='common/foot.html'}}
