{{include file='common/head.html'}}
<script language='javascript'>
function help()
{
	var status = $("#help").css('display');
	if (status =='none') {
		$("#help").css('display','');
	}else{
		$("#help").css('display','none');
	}
}
</script>
<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header"><h3>导入主控数据库</h3></div>
    <div class="ep-card-body">
      <form name='remotemysqldumpin' action="?c=func&a=syncVhost" method="post" class="ep-form">
        <div class="form-group">
          <label>vhms数据库IP</label>
    <div class="controls">
    <input type='text' name='db_host'>
  </div>
  </div>
        <div class="form-group">
          <label>vhms数据库账号</label>
    <div class="controls">
    <input type='text' name='db_user'>
  </div>
  </div>
        <div class="form-group">
          <label>vhms数据库密码</label>
    <div class="controls">
    <input type='text' name='db_passwd'>
  </div>
  </div>
        <div class="form-group">
          <label>vhms数据库名</label>
    <div class="controls">
    <input type='text' name='db_name'>
  </div>
  </div>
        <div class="form-group">
          <label>vhms会员账号</label>
    <div class="controls">
    <input type='text' name='username'>
  </div>
  </div>
        <div class="ep-flex ep-gap-2 ep-mt-4">
          <button type='submit' class="btn" style="width:200px;"><i data-lucide="check"></i> 确定</button>
          <a href="javascript:help();">帮助?</a>
        </div>
      </form>
    </div>
  </div>
  <div id="help" class='help' style="display:none;background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:8px;padding:16px;margin-bottom:16px;">
    <p>当本节点(easypanel)连接主控(vhms),作为主控的一个被控时本节点已存在网站</p>
    <p>可以使用本功能，将本节点已存在的网站导入到主控，从而使主控不能注</p>
    <p>册本节点已存在的网站名,避免网站重叠&nbsp;
    <a href="javascript:help();">关闭</a></p>
  </div>
</div>
