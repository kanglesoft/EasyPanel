{{include file='common/head.html'}}
{{assign var='layout_type' value='install'}}
<script language="javascript">
function check_db()
{
	var url = '?c=install&a=checkdb&db_host=' + form1.db_host + '&db_name=' + form1.db_name + '&db_user=' + form1.db_user + '&db_passwd=' ;
	window.open(url,'','height=100,width=250,resize=no,scrollbars=no,toolsbar=no,top=200,left=200');
}
</script>
<div class="ep-content">
  {{if $msg}}
  <div class="ep-alert ep-alert-danger">
    <i data-lucide="alert-circle"></i>
    <span>{{$msg}}</span>
  </div>
  {{/if}}
  <div class="ep-card">
    <div class="ep-card-header"><h3>欢迎安装kangle虚拟主机管理系统!</h3></div>
    <div class="ep-card-body">
      <form id="form1" name="form1" method="post" action="?c=install&a=step2" class="ep-form">
        <div class="form-group">
          <label>数据库地址</label>
    <div class="controls">
    <input name="db_host" type="text" value="{{$request.db_host}}"  />
  </div>
  </div>
        <div class="form-group">
          <label>数据库名</label>
    <div class="controls">
    <input name="db_name" type="text" value="{{$request.db_name}}"  />
  </div>
  </div>
        <div class="form-group">
          <label>数据库用户名</label>
    <div class="controls">
    <input name="db_user" type="text" value="{{$request.db_user}}"  />
  </div>
  </div>
        <div class="form-group">
          <label>数据库密码</label>
    <div class="controls">
    <input name="db_passwd" type="password" autocomplete='off'  />
  </div>
  </div>
        <div class="form-group">
          <label>域名</label>
    <div class="controls">
    <input name="domain" type="text" value="{{$request.domain}}"  />
  </div>
  </div>
        <div class="form-group">
          <label>初始管理员</label>
    <div class="controls">
    <input name="admin_user" type="text" value="{{$request.admin_user}}"  />
  </div>
  </div>
        <div class="form-group">
          <label>初始管理员密码</label>
    <div class="controls">
    <input name="admin_passwd" type="password" autocomplete='off'  />
  </div>
  </div>
        <div class="ep-flex ep-gap-2 ep-mt-4">
          <button type="submit" name="Submit" class="btn" style="width:200px;"><i data-lucide="arrow-right"></i> 下一步</button>
        </div>
      </form>
    </div>
  </div>
</div>
{{include file='common/foot.html'}}
