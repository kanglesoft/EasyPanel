{{include file='common/head.html'}}
<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header"><h3>调试工具 — dig工具</h3></div>
    <div class="ep-card-body">
      <form action='?c=servers&a=dig&server={{$server}}' method='post' class="ep-form ep-form-grid">
        <div class="form-group">
          <label>域名</label>
    <div class="controls">
    <input name='domain' value='{{$domain}}'>
  </div>
  </div>
        <div class="form-group">
          <label>线路</label>
    <div class="controls">
    <select name='view'>
    {{foreach from=$views item=v}}
    <option value='{{$v.name}}' {{if $v.name==$view}} selected {{/if}}>{{$v.desc}}</option>
    {{/foreach}}
    </select>
  </div>
  </div>
        <div class="form-group">
          <label>服务器</label>
    <div class="controls">
    <select name='node'>
    {{foreach from=$nodes item=s}}
    <option value='{{$s}}' {{if $s==$node}} selected {{/if}}>{{$s}}</option>
    {{/foreach}}
    </select>
  </div>
  </div>
        <div class="form-group">
          <label>&nbsp;</label>
    <div class="controls">
            <button type='submit' class="btn"><i data-lucide="search"></i> 查询</button>
          </div>
  </div>
        {{if $dig}}
        <div class="form-group" style="grid-column:1/-1;">
          <label>查询结果</label>
    <div class="controls">
            <pre style="background:var(--color-bg-base);padding:12px;border-radius:8px;overflow:auto;">{{$dig}}</pre>
          </div>
  </div>
        {{/if}}
      </form>
    </div>
  </div>
</div>
{{include file='common/foot.html'}}
