{{include file='common/head.html'}}
<script language="javascript">
function checkPassword()
{
	if(frm.passwd.value==""){
		alert('新密码不能为空');
		return;
	}
	if(frm.passwd.value!=frm.passwd2.value){
		alert('两次密码不相等');
		return;
	}
	frm.submit();
}
</script>
<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header"><h3>修改账号信息</h3></div>
    <div class="ep-card-body">
      <form name='frm' action="?c=session&amp;a=changePassword" method="post" class="ep-form" style="max-width:480px;">
        <div class="form-group">
          <label>用户名</label>
    <div class="controls">
    <input type="text" name='admin' value='{{getRole('admin')}}' />
  </div>
  </div>
        <div class="form-group">
          <label>原密码</label>
    <div class="controls">
    <input type='password' name='oldpasswd' placeholder="请输入原密码" />
  </div>
  </div>
        <div class="form-group">
          <label>新密码</label>
    <div class="controls">
    <input type='password' name='passwd' placeholder="请输入新密码" />
  </div>
  </div>
        <div class="form-group">
          <label>确认新密码</label>
    <div class="controls">
    <input type='password' name='passwd2' placeholder="请再次输入新密码" />
  </div>
  </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label></label>
    <div class="controls">
            <button type="button" class="btn" onclick='checkPassword()'><i data-lucide="check"></i> 确定</button>
          </div>
  </div>
      </form>
    </div>
  </div>
</div>
{{include file='common/foot.html'}}
