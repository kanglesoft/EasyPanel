{{include file='common/head.html'}}
<script language='javascript'>
function show(url)
{
	window.open(url,'','height=100,width=250,resize=no,scrollbars=no,toolsbar=no,top=200,left=200');
}
function check_user_old()
{
	show('?c=product&a=check&product_type=vhost&name='+document.nodeform.name.value);
}
function check_register()
{
	if(nodeform.name.value.length<3){
		alert('用户名长度最小为3个字母');
		return false;
	}
	if(nodeform.name.value=='root'){
		alert('root为保留账号，请选择其他账号');
		return false;
	}
	return nodeform.submit();
}
function check_open_url(va)
{
	if(va=='free')
	{
		var url='?c=product&a=sellForm&product=vhost';
		window.location=url;
		return;
	}else{
		var url='?c=product&a=productSellFrom&product_id='+va;
		window.location=url;
		return;
	}
}
function open_advance()
{
	var adv = document.getElementById('advance');
	var link = document.getElementById('advance_link');
	// 双向折叠：已展开则收起，已收起则展开
	// 注意：展开时必须显式设为 'block'，不能设为 ''（空字符串会被 CSS 默认 block 覆盖，
	// 导致第二次点击时 adv.style.display 仍为 '' 而永远走不到收起分支）
	if (adv.style.display == 'none' || adv.style.display == '') {
		adv.style.display = 'block';
		if (link) { link.innerHTML = '收起'; }
	} else {
		adv.style.display = 'none';
		if (link) { link.innerHTML = '展开'; }
	}
}
function check_user_result()
{
	if (xmlhttp.readyState==4) {
		var msg='';
		var ret=0;
		try{
			if(xmlhttp.status == 200){
				var dataArray=xmlhttp.responseXML.getElementsByTagName('result');
				ret = dataArray[0].getAttribute('ret');
				if(ret=='1'){
					msg="用户名可用";
					document.getElementById('check_user_result').innerHTML=msg;
					return false;
				}else{
					msg="用户名不可用";
					document.getElementById('check_user_result').innerHTML=msg;
				}
			}
		}catch(e){}
	}
}
function getFirstElementsByName(name)
{
	var x=document.getElementsByName(name);
	return x[0];
}
function check_user(va)
{
	var edit = '{{$edit}}';
	if (edit != "") {
		return;
	}
	if(va==""){
		return;
	}
	var name = jQuery.trim(va);
	jQuery("#name").val(name);
	var url='?c=vhostproduct&a=ajaxCheckUser&name='+name;
	jQuery.get(url,function(msg) {
		if (msg=="1") {
			alert("用户名不可用");
			return false;
		}
		jQuery("#check_user_result").html("用户名可用");
	});
}
function display_productinfo()
{
	var id=document.getElementById('product_ids').selectedIndex;
	var url="?c=product&a=ajaxGetProductInfo&id="+id;
	ajax_open_url(url,get_product_result);
	document.getElementById('product_info').style.display="";
}
function display_product(va)
{
	if (va=="null") {
		jQuery('.free_tbody').show();
	} else {
		jQuery('.free_tbody').hide();
	}
}
</script>
<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header">
      <h3>{{if $edit}}修改网站{{else}}新增网站{{/if}}</h3>
    </div>
    <div class="ep-card-body">
      <form name='nodeform' action="?c=product&a=sell&product_type=vhost&edit={{$edit}}" method="post" class="ep-form">
        <div class="form-group">
          <label>网站名:</label>
    <div class="controls">
      <input name="name" type="text" id="name" {{if $edit}}readonly{{/if}} onblur="check_user(this.value)" value="{{$vhost.name}}" style="width:260px;" required>
            <span style="color:var(--color-danger);" id='check_user_result'>{{if !$edit}}*必填,不支持中文{{/if}}</span>
    </div>
  </div>
        {{if !$edit}}
        <div class="form-group">
          <label>密码:</label>
    <div class="controls">
      <input name="passwd" type="password" id="passwd" style="width:260px;" required><span style="color:var(--color-danger);">*必填</span>
    </div>
  </div>
        <div class="form-group" id='expire_time'>
          <label>使用期限:</label>
    <div class="controls">
      <label class="radio-inline"><input name="month" type="radio" value="1">一个月</label>
            <label class="radio-inline"><input name="month" type="radio" value="3">三个月</label>
            <label class="radio-inline"><input name="month" type="radio" value="6">六个月</label>
            <label class="radio-inline"><input name="month" type="radio" value="12">一年</label>
            <label class="radio-inline"><input name="month" type="radio" value="36">三年</label>
            <label class="radio-inline"><input name="month" type="radio" value="0" checked>不限</label>
    </div>
  </div>
        {{/if}}
        <div class="form-group">
          <label>高级(为空系统自动完成):</label>
    <div class="controls">
      [<a href='javascript:open_advance()' id='advance_link'>展开</a>]
            <div style='display:none' id='advance'>
            运行用户:<input type='text' name='uid' value='{{$vhost.uid}}' style="width:120px;"><br>
            组/密码:<input type='text' name='gid' value='{{$vhost.gid}}' style="width:120px;"><br>
            网站路径:<input type='text' name='doc_root' value='{{$vhost.doc_root}}' style="width:320px;">
            </div>
    </div>
  </div>
        <div class="form-group">
          <label>产品名称:</label>
    <div class="controls">
      <select name="product_id" id='product_ids' onchange='display_product(this.value);' style="width:260px;">
              <option value="null">自由类型</option>
              {{foreach from=$products item=product}}
              <option value="{{$product.id}}" {{if $product_id==$product.id}} selected {{/if}}>
              {{$product.product_name}}
              </option>
              {{/foreach}}</select>
    </div>
  </div>
        {{include file="common/product.html"}}
        <div class="ep-flex ep-gap-2 ep-mt-4">
          <button type="submit" class="btn" style="width:200px;">确定</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script language='javascript'>
{{if $product_id==""}}
	jQuery('.free_tbody').not('#gj').show();
{{/if}}
changeNode();
</script>
