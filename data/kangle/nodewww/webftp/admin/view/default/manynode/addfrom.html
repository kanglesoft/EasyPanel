{{include file='common/head.html'}}
<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header"><h3>增加辅节点</h3></div>
    <div class="ep-card-body">
      <form name='manynode' action="?c=manynode&a=add&name={{$node.name}}" method="post" class="ep-form">
        <div class="form-group">
          <label>节点名称:</label>
    <div class="controls">
    {{if $edit}}{{$node.name}}{{else}}<input name='name' type='text'  required><span style="color:var(--color-danger);">&nbsp;字母，数字的集合</span>{{/if}}
  </div>
  </div>
        <div class="form-group">
          <label>节点IP:</label>
    <div class="controls">
    <input name='host' type='text' value="{{$node.host}}"  required>
  </div>
  </div>
        <div class="form-group">
          <label>节点端口:</label>
    <div class="controls">
    <input name='port' type='text' value="{{$node.port}}"  required>
  </div>
  </div>
        <div class="form-group">
          <label>节点安全码:</label>
    <div class="controls">
    <input name='skey' type='text' value="{{$node.skey}}"  required>
  </div>
  </div>
        <div class="form-group">
          <label>备注:</label>
    <div class="controls">
    <textarea name='mem' rows='1' cols='24'>{{$node.mem}}</textarea>
  </div>
  </div>
        <div class="ep-flex ep-gap-2 ep-mt-4">
          <button type="submit" class="btn"><i data-lucide="check"></i> 提交</button>
        </div>
      </form>
    </div>
  </div>
</div>
{{include file='common/foot.html'}}
