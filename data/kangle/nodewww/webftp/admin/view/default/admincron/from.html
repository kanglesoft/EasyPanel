{{include file='common/head.html'}}
<div class="ep-content">
  <div class="ep-card">
    <div class="ep-card-header"><h3>{{$form_title|escape}}</h3></div>
    <div class="ep-card-body">
      {{if $msg}}
      <div class="ep-alert ep-alert-danger ep-mb-4">{{$msg|escape}}</div>
      {{/if}}
      <form id="cronform" action="?c=admincron&amp;a=save" method="post" class="ep-form">
        <input type="hidden" name="id" id="task_id" value="{{$task.id|default:0}}">
        <input type="hidden" name="cron" id="cron" value="">

        <div class="form-group">
          <label for="name">任务名称</label>
          <div class="controls">
            <input type="text" id="name" name="name" value="{{$task.name|escape}}" maxlength="100" placeholder="例如：每小时清理临时文件">
          </div>
        </div>

        <div class="form-group">
          <label for="type">任务类型</label>
          <div class="controls">
            <select id="type" name="type" class="ep-select" onchange="switchType();">
              <option value="url" {{if $task.type == 'url'}}selected{{/if}}>URL（定时访问网址）</option>
              <option value="shell" {{if $task.type == 'shell'}}selected{{/if}}>Shell（容器内执行命令）</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="cmd">命令 / URL</label>
          <div class="controls">
            <textarea id="cmd" name="cmd" rows="3" style="width:100%;font-family:monospace;" placeholder="http://127.0.0.1/wp-cron.php">{{$task.cmd|escape}}</textarea>
            <div id="cmd_tip" style="font-size:12px;color:var(--color-font-secondary);margin-top:6px;"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="period_type">执行周期</label>
          <div class="controls">
            <select id="period_type" class="ep-select" onchange="updateVisibility();buildCron();">
              <option value="every-minute">每分钟</option>
              <option value="every-n-minutes">每 N 分钟</option>
              <option value="hourly">每小时第 N 分钟</option>
              <option value="every-n-hours">每 N 小时</option>
              <option value="daily">每天定时</option>
              <option value="every-n-days">每 N 天</option>
              <option value="weekly">每周</option>
              <option value="monthly">每月</option>
              <option value="yearly">每年</option>
              <option value="custom">自定义 crontab</option>
            </select>
            <div id="pf_row" class="ep-flex ep-gap-2 ep-mt-2" style="flex-wrap:wrap;">
              <span id="w_n_minutes" style="display:none;">每 <input type="text" id="p_n_minutes" value="5" size="3"> 分钟</span>
              <span id="w_minute" style="display:none;">第 <input type="text" id="p_minute" value="0" size="3"> 分钟</span>
              <span id="w_n_hours" style="display:none;">每 <input type="text" id="p_n_hours" value="2" size="3"> 小时</span>
              <span id="w_hour" style="display:none;">小时 <input type="text" id="p_hour" value="3" size="3"> (0-23)</span>
              <span id="w_n_days" style="display:none;">每 <input type="text" id="p_n_days" value="1" size="3"> 天</span>
              <span id="w_day" style="display:none;">日 <input type="text" id="p_day" value="1" size="3"> (1-31)</span>
              <span id="w_weekday" style="display:none;">星期 <select id="p_weekday" class="ep-select"></select></span>
              <span id="w_month" style="display:none;">月份 <select id="p_month" class="ep-select"></select></span>
              <span id="w_custom" style="display:none;"><input type="text" id="p_custom" size="24" placeholder="分 时 日 月 周"> <a href="javascript:void(0)" onclick="pEl('p_custom').value=pEl('cron').value;">使用当前表达式</a></span>
            </div>
            <div style="font-size:12px;color:var(--color-font-secondary);margin-top:8px;">
              生成表达式：<code id="cron_preview">* * * * *</code>　<span id="cron_desc"></span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>防重叠执行</label>
          <div class="controls">
            <label class="ep-switch {{if $task.flock != 0}}is-on{{else}}is-off{{/if}}">
              <span class="track"></span>
              <input type="checkbox" id="flock" name="flock" value="1" {{if $task.flock != 0}}checked{{/if}} style="position:absolute;opacity:0;">
            </label>
            <span style="margin-left:12px;font-size:12px;color:var(--color-font-secondary);">勾选后同一任务上一次未跑完时本次自动跳过（flock -n）。</span>
          </div>
        </div>

        <div class="ep-flex ep-gap-2 ep-mt-4">
          <button type="submit" class="btn btn-success" id="submitBtn"><i data-lucide="check"></i> 保存</button>
          <a href="?c=admincron" class="btn">取消</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
function pEl(id){ return document.getElementById(id); }

function initCronOptions(){
  var weekday = pEl('p_weekday');
  if (weekday && weekday.options.length === 0) {
    for (var i = 0; i <= 6; i++) {
      weekday.options[i] = new Option('星期' + '日一二三四五六'.charAt(i), i);
    }
  }
  var month = pEl('p_month');
  if (month && month.options.length === 0) {
    for (var j = 1; j <= 12; j++) {
      month.options[j - 1] = new Option(j + ' 月', j);
    }
  }
}

var SHOW_MAP = {
  'every-minute': [],
  'every-n-minutes': ['w_n_minutes'],
  'every-n-hours': ['w_minute', 'w_n_hours'],
  'every-n-days': ['w_minute', 'w_hour', 'w_n_days'],
  'hourly': ['w_minute'],
  'daily': ['w_minute', 'w_hour'],
  'weekly': ['w_minute', 'w_hour', 'w_weekday'],
  'monthly': ['w_minute', 'w_hour', 'w_day'],
  'yearly': ['w_minute', 'w_hour', 'w_day', 'w_month'],
  'custom': ['w_custom']
};

function updateVisibility(){
  var t = pEl('period_type').value;
  var groups = ['w_n_minutes','w_minute','w_n_hours','w_hour','w_n_days','w_day','w_weekday','w_month','w_custom'];
  var show = SHOW_MAP[t] || [];
  for (var i = 0; i < groups.length; i++) {
    pEl(groups[i]).style.display = show.indexOf(groups[i]) >= 0 ? '' : 'none';
  }
  pEl('pf_row').style.display = show.length ? '' : 'none';
}

function pVal(id, def, min, max){
  var v = parseInt(pEl(id).value, 10);
  if (isNaN(v) || v < min || v > max) v = def;
  return v;
}
function pad2(n){ return (n < 10 ? '0' : '') + n; }

function buildCron(){
  var t = pEl('period_type').value;
  var cron = '* * * * *', desc = '每分钟执行';
  if (t === 'every-n-minutes') {
    var nM = pVal('p_n_minutes', 5, 1, 59);
    cron = '*/' + nM + ' * * * *'; desc = '每 ' + nM + ' 分钟执行';
  } else if (t === 'every-n-hours') {
    var mi = pVal('p_minute', 0, 0, 59), nH = pVal('p_n_hours', 2, 1, 23);
    cron = mi + ' */' + nH + ' * * *'; desc = '每 ' + nH + ' 小时的第 ' + mi + ' 分钟执行';
  } else if (t === 'every-n-days') {
    var mi2 = pVal('p_minute', 0, 0, 59), h2 = pVal('p_hour', 3, 0, 23), nD = pVal('p_n_days', 1, 1, 31);
    cron = mi2 + ' ' + h2 + ' */' + nD + ' * *'; desc = '每 ' + nD + ' 天的 ' + pad2(h2) + ':' + pad2(mi2) + ' 执行';
  } else if (t === 'hourly') {
    var mi3 = pVal('p_minute', 0, 0, 59);
    cron = mi3 + ' * * * *'; desc = '每小时的第 ' + mi3 + ' 分钟执行';
  } else if (t === 'daily') {
    var mi4 = pVal('p_minute', 0, 0, 59), h4 = pVal('p_hour', 3, 0, 23);
    cron = mi4 + ' ' + h4 + ' * * *'; desc = '每天 ' + pad2(h4) + ':' + pad2(mi4) + ' 执行';
  } else if (t === 'weekly') {
    var mi5 = pVal('p_minute', 0, 0, 59), h5 = pVal('p_hour', 3, 0, 23), w5 = pEl('p_weekday').value || '0';
    cron = mi5 + ' ' + h5 + ' * * ' + w5; desc = '每周' + '日一二三四五六'.charAt(parseInt(w5,10)) + ' ' + pad2(h5) + ':' + pad2(mi5) + ' 执行';
  } else if (t === 'monthly') {
    var mi6 = pVal('p_minute', 0, 0, 59), h6 = pVal('p_hour', 3, 0, 23), d6 = pVal('p_day', 1, 1, 31);
    cron = mi6 + ' ' + h6 + ' ' + d6 + ' * *'; desc = '每月 ' + d6 + ' 日 ' + pad2(h6) + ':' + pad2(mi6) + ' 执行';
  } else if (t === 'yearly') {
    var mi7 = pVal('p_minute', 0, 0, 59), h7 = pVal('p_hour', 3, 0, 23), d7 = pVal('p_day', 1, 1, 31), mo7 = pVal('p_month', 1, 1, 12);
    cron = mi7 + ' ' + h7 + ' ' + d7 + ' ' + mo7 + ' *'; desc = '每年 ' + mo7 + ' 月 ' + d7 + ' 日 ' + pad2(h7) + ':' + pad2(mi7) + ' 执行';
  } else if (t === 'custom') {
    cron = pEl('p_custom').value.replace(/^\s+|\s+$/g, '').replace(/\s+/g, ' ') || '* * * * *';
    desc = '自定义表达式（保存时服务端逐字段校验）';
  }
  pEl('cron').value = cron;
  pEl('cron_preview').innerHTML = cron;
  pEl('cron_desc').innerHTML = desc;
}

function parseCron(cron){
  var sel = pEl('period_type');
  if (!cron) { sel.value = 'every-minute'; return; }
  var p = cron.replace(/^\s+|\s+$/g, '').replace(/\s+/g, ' ').split(' ');
  if (p.length !== 5) { sel.value = 'custom'; pEl('p_custom').value = cron; return; }
  var m = p[0], h = p[1], d = p[2], mo = p[3], w = p[4];
  var type = 'custom';
  if (m === '*' && h === '*' && d === '*' && mo === '*' && w === '*') {
    type = 'every-minute';
  } else if (/^\*\/\d+$/.test(m) && h === '*' && d === '*' && mo === '*' && w === '*') {
    type = 'every-n-minutes'; pEl('p_n_minutes').value = parseInt(m.slice(2), 10) || 5;
  } else if (/^\*\/\d+$/.test(h) && /^\d+$/.test(m) && d === '*' && mo === '*' && w === '*') {
    type = 'every-n-hours'; pEl('p_minute').value = parseInt(m, 10) || 0; pEl('p_n_hours').value = parseInt(h.slice(2), 10) || 2;
  } else if (/^\*\/\d+$/.test(d) && /^\d+$/.test(m) && /^\d+$/.test(h) && mo === '*' && w === '*') {
    type = 'every-n-days'; pEl('p_minute').value = parseInt(m, 10); pEl('p_hour').value = parseInt(h, 10); pEl('p_n_days').value = parseInt(d.slice(2), 10) || 1;
  } else if (h === '*' && d === '*' && mo === '*' && w === '*' && /^\d+$/.test(m)) {
    type = 'hourly'; pEl('p_minute').value = parseInt(m, 10);
  } else if (d === '*' && mo === '*' && w === '*' && /^\d+$/.test(m) && /^\d+$/.test(h)) {
    type = 'daily'; pEl('p_minute').value = parseInt(m, 10); pEl('p_hour').value = parseInt(h, 10);
  } else if (d === '*' && mo === '*' && /^\d+$/.test(w) && w !== '*' && /^\d+$/.test(m) && /^\d+$/.test(h)) {
    type = 'weekly'; pEl('p_minute').value = parseInt(m, 10) || 0; pEl('p_hour').value = parseInt(h, 10) || 0; pEl('p_weekday').value = (w === '7' ? '0' : w);
  } else if (mo === '*' && w === '*' && /^\d+$/.test(m) && /^\d+$/.test(h) && /^\d+$/.test(d)) {
    type = 'monthly'; pEl('p_minute').value = parseInt(m, 10); pEl('p_hour').value = parseInt(h, 10); pEl('p_day').value = parseInt(d, 10);
  } else if (w === '*' && /^\d+$/.test(mo) && /^\d+$/.test(d) && /^\d+$/.test(m) && /^\d+$/.test(h)) {
    type = 'yearly'; pEl('p_minute').value = parseInt(m, 10); pEl('p_hour').value = parseInt(h, 10); pEl('p_day').value = parseInt(d, 10); pEl('p_month').value = parseInt(mo, 10);
  }
  sel.value = type;
  if (type === 'custom') pEl('p_custom').value = cron;
}

function switchType(){
  var type = pEl('type').value;
  var cmd = pEl('cmd');
  if (type === 'url') {
    cmd.placeholder = 'http(s):// 开头的完整网址，例如 http://127.0.0.1/index.php';
    pEl('cmd_tip').innerHTML = '以面板配置的 HTTP 客户端发起 GET，超时 30 秒，2xx/3xx 视为成功。';
  } else {
    cmd.placeholder = '例如：/usr/bin/php74 /vhs/kangle/nodewww/webftp/framework/shell.php sync_flow';
    pEl('cmd_tip').innerHTML = '以 root 身份通过容器内 /bin/sh 执行，请谨慎填写；命令保存后写入任务日志可追溯。';
  }
}

// ep-switch 样式联动（与 security/add.html 同款 checkbox 开关）
$(function(){
  $('#flock').on('change', function(){
    $(this).closest('.ep-switch').toggleClass('is-on', this.checked).toggleClass('is-off', !this.checked);
  });
});

// —— 初始化：解析已有任务的 cron，回填周期构造器 ——
initCronOptions();
/* escape:'javascript' 输出无引号的 %-编码安全串（Smarty 文档用法即外包引号） */
parseCron('{{if $task.cron}}{{$task.cron|escape:'javascript'}}{{/if}}');
updateVisibility();
buildCron();
switchType();

// —— 提交前校验（服务端会再校验一遍，这里只为止损） ——
$('#cronform').on('submit', function(){
  buildCron();
  if (!pEl('name').value.replace(/^\s+|\s+$/g, '')) { alert('请填写任务名称'); pEl('name').focus(); return false; }
  if (!pEl('cmd').value.replace(/^\s+|\s+$/g, '')) { alert('请填写命令或网址'); pEl('cmd').focus(); return false; }
  if (!/^\S+( \S+){4}$/.test(pEl('cron').value.replace(/\s+/g, ' '))) { alert('周期表达式必须是 5 段，例如 */5 * * * *'); return false; }
  if (pEl('type').value === 'url' && !/^https?:\/\/\S+$/i.test(pEl('cmd').value.replace(/^\s+|\s+$/g, ''))) { alert('URL 任务必须以 http:// 或 https:// 开头'); return false; }
  $('#submitBtn').prop('disabled', true);
  return true;
});
</script>
